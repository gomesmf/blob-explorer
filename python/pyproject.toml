[project]
name = "blobx"
version = "0.1.0"
description = "Browse and query Parquet in Azurite/Azure Blob Storage"
requires-python = ">=3.11"
dependencies = [
    "azure-storage-blob>=12.20",
    "adlfs>=2024.7.0",
    "duckdb>=1.2.1",
    "polars>=1.0",
    "pyarrow>=16",
    "rich>=13.7",
    "marimo>=0.9",
]

[project.scripts]
blobx-seed = "blobx.seed:main"
blobx-browse = "blobx.browse:main"
blobx-query = "blobx.query_azure:main"
blobx-query-fsspec = "blobx.query_fsspec:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blobx"]
