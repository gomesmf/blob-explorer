# rclone remotes for the local stack.
#   rclone --config rclone/rclone.conf ls azurite:data
# The Makefile passes --config for you; `make rclone-*`.

[azurite]
type = azureblob
account = devstoreaccount1
key = Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
endpoint = http://127.0.0.1:10000/devstoreaccount1

# Same bytes through s3proxy, for comparing the two protocols.
[azurite-s3]
type = s3
provider = Other
access_key_id = local
secret_access_key = localsecret
endpoint = http://127.0.0.1:8080
force_path_style = true
region = us-east-1
